<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Mauro Serrano — Full-stack developer, cofundador de Quobit</title>
<desc id="desc">Desarrollador full-stack en Sevilla. Webs, apps, automatizaciones e IA aplicada. Autor de TrainPicker y reel-gallery.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  </pattern>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2f5bea" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#2f5bea" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#3cc6f5" stop-opacity="0.33"/>
    <stop offset="1" stop-color="#3cc6f5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="termGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2f5bea" stop-opacity="0.16"/>
    <stop offset="0.6" stop-color="#2f5bea" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fadeGrid" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
  </linearGradient>
  <mask id="gridMask"><rect width="1200" height="440" fill="url(#fadeGrid)"/></mask>
  <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
  <clipPath id="type0"><rect class="type" x="720.1" y="112" width="76.2" height="25" style="animation-delay:1.20s;animation-duration:0.36s"/></clipPath><clipPath id="type2"><rect class="type" x="720.1" y="170" width="139.4" height="25" style="animation-delay:2.24s;animation-duration:0.61s"/></clipPath><clipPath id="type4"><rect class="type" x="720.1" y="228" width="220.7" height="25" style="animation-delay:3.53s;animation-duration:0.92s"/></clipPath><clipPath id="type7"><rect class="type" x="720.1" y="311" width="220.7" height="25" style="animation-delay:5.30s;animation-duration:0.92s"/></clipPath>
</defs>
<style>
  .fade { animation: fade .5s ease-out both; }
  .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) both; }
  .type { transform-box: fill-box; transform-origin: left center; animation-name: type; animation-timing-function: steps(18, end); animation-fill-mode: both; }
  .cursor { animation: blink 1.1s steps(1, end) infinite; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
  .drift { animation: drift 14s ease-in-out infinite alternate; }
  .hand { stroke-dasharray: 340; stroke-dashoffset: 0; animation: draw 1s .9s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-60px, 30px); } }
  @keyframes draw { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="440" fill="#070d20"/>
  <rect width="1200" height="440" fill="url(#grid)" mask="url(#gridMask)"/>
  <g class="drift"><ellipse cx="980" cy="60" rx="420" ry="300" fill="url(#glowA)"/></g>
  <ellipse cx="120" cy="460" rx="380" ry="220" fill="url(#glowB)"/>

  <!-- etiqueta -->
  <g class="fade" style="animation-delay:.1s">
    <rect x="64" y="56" width="352" height="34" rx="17" fill="#111c3d" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle class="pulse" cx="86" cy="73" r="5" fill="#5dd3a0"/>
    <circle cx="86" cy="73" r="5" fill="#5dd3a0"/>
    <text x="102" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#a3adc6">Disponible para proyectos · Sevilla</text>
  </g>

  <!-- nombre y rol -->
  <g class="fade" style="animation-delay:.2s">
    <text x="62" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="#eceff7">Mauro Serrano</text>
  </g>
  <g class="fade" style="animation-delay:.35s">
    <text x="64" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#eceff7" fill-opacity="0.92">Full-stack developer · cofundador de <tspan fill="#8fb0ff" font-weight="700">Quobit</tspan></text>
  </g>

  <!-- frase -->
  <g class="fade" style="animation-delay:.5s">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#a3adc6">
      <tspan x="64" y="268">Cojo ideas a medio cocer y las convierto en software</tspan>
      <tspan x="64" y="298">que alguien abre <tspan fill="#eceff7" font-weight="600">cada mañana</tspan>.</tspan>
    </text>
  </g>
  <path class="hand" d="M219 308 C 250 303, 300 302, 340 306" fill="none" stroke="#f2d58a" stroke-width="3.2" stroke-linecap="round"/>

  <g class="fade" style="animation-delay:0.90s"><rect x="64.0" y="340" width="108.3" height="30" rx="15.0" fill="#111c3d" stroke="#ffffff" stroke-opacity="0.10"/><text x="118.1" y="360.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#a3adc6">TypeScript</text></g><g class="fade" style="animation-delay:0.98s"><rect x="182.3" y="340" width="83.0" height="30" rx="15.0" fill="#111c3d" stroke="#ffffff" stroke-opacity="0.10"/><text x="223.8" y="360.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#a3adc6">Next.js</text></g><g class="fade" style="animation-delay:1.06s"><rect x="275.3" y="340" width="74.6" height="30" rx="15.0" fill="#111c3d" stroke="#ffffff" stroke-opacity="0.10"/><text x="312.6" y="360.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#a3adc6">Python</text></g><g class="fade" style="animation-delay:1.14s"><rect x="359.8" y="340" width="57.7" height="30" rx="15.0" fill="#111c3d" stroke="#ffffff" stroke-opacity="0.10"/><text x="388.7" y="360.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#a3adc6">Java</text></g><g class="fade" style="animation-delay:1.22s"><rect x="427.6" y="340" width="83.0" height="30" rx="15.0" fill="#111c3d" stroke="#ffffff" stroke-opacity="0.10"/><text x="469.1" y="360.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#a3adc6">Flutter</text></g><g class="fade" style="animation-delay:1.30s"><rect x="520.6" y="340" width="40.9" height="30" rx="15.0" fill="#111c3d" stroke="#ffffff" stroke-opacity="0.10"/><text x="541.0" y="360.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#a3adc6">IA</text></g>

  <g class="rise"><rect x="680" y="52" width="468" height="336" rx="16" fill="#0a1229" stroke="#ffffff" stroke-opacity="0.10"/><rect x="680" y="52" width="468" height="336" rx="16" fill="url(#termGlow)"/><path d="M680 96H1148" stroke="#ffffff" stroke-opacity="0.07"/><circle cx="704" cy="74" r="6" fill="#ff5f57" opacity="0.9"/><circle cx="724" cy="74" r="6" fill="#febc2e" opacity="0.9"/><circle cx="744" cy="74" r="6" fill="#28c840" opacity="0.9"/><text x="914.0" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7c88a8">mauro@quobit — zsh</text><g class="fade" style="animation-delay:1.05s"><text x="702" y="130" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#5dd3a0">❯</text></g><text x="720.1" y="130" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#eceff7" clip-path="url(#type0)">whoami</text><g class="fade" style="animation-delay:1.81s"><text x="702" y="155" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan fill="#eceff7">mauro</tspan><tspan fill="#a3adc6"> · full-stack @ </tspan><tspan fill="#8fb0ff">quobit.es</tspan></text></g><g class="fade" style="animation-delay:2.09s"><text x="702" y="188" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#5dd3a0">❯</text></g><text x="720.1" y="188" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#eceff7" clip-path="url(#type2)">ls proyectos/</text><g class="fade" style="animation-delay:3.10s"><text x="702" y="213" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan fill="#3cc6f5">trainpicker/  cardeo/  planabc/  reel-gallery/</tspan></text></g><g class="fade" style="animation-delay:3.38s"><text x="702" y="246" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#5dd3a0">❯</text></g><text x="720.1" y="246" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#eceff7" clip-path="url(#type4)">cat trainpicker/README</text><g class="fade" style="animation-delay:4.70s"><text x="702" y="271" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan fill="#a3adc6">Avisa cuando se libera plaza en un</tspan></text></g><g class="fade" style="animation-delay:4.88s"><text x="702" y="296" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan fill="#a3adc6">AVE completo. En producción, gratis.</tspan></text></g><g class="fade" style="animation-delay:5.15s"><text x="702" y="329" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#5dd3a0">❯</text></g><text x="720.1" y="329" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#eceff7" clip-path="url(#type7)">./contactar --proyecto</text><g class="fade" style="animation-delay:6.47s"><text x="702" y="354" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan fill="#5dd3a0">✓ </tspan><tspan fill="#eceff7">info@quobit.es</tspan><tspan fill="#a3adc6"> · respuesta en 1–2 días</tspan></text></g><g class="fade" style="animation-delay:6.65s"><text x="702" y="387" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#5dd3a0">❯</text><rect class="cursor" x="720.1" y="373" width="9" height="18" rx="1.5" fill="#8fb0ff"/></g></g>
</g>
</svg>
